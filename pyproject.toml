[project]
name = "adam_tts"
version = "0.2.1"
description = "TTS workbench CLI + agent Skill (mimo / edge / qwen / doubao backends)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Adam Zhuang" }]
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "python-dotenv>=1.0",
    "edge-tts>=7.0",
    "numpy>=2.4.6",
    "soundfile>=0.14.0",
]

[project.optional-dependencies]
# Local Qwen3-TTS backend and forced aligner (Mac mini). Optional: by default the CLI runs the models
# in worker processes under the existing envs ~/qwen3-tts/.venv and ~/qwen3-tts/aligner/.venv; these
# extras are only needed with `python = "self"` in config.toml (single env). Note the two upstream
# packages pin different transformers versions, so installing both into one env may not resolve.
qwen = ["qwen-tts>=0.1.1", "torch>=2.4"]
align = ["qwen-asr>=0.0.6", "torch>=2.4"]

[project.scripts]
adam_tts = "adam_tts.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/adam_tts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["smoke: real backend calls; gated on env vars (ADAM_TTS_SMOKE=1)"]
addopts = "-m 'not smoke'"

[tool.uv]
# qwen-tts pins transformers==4.57.3, qwen-asr pins 4.57.6: the two extras cannot share one env.
conflicts = [[{ extra = "qwen" }, { extra = "align" }]]
