[project]
name = "adam_tts"
version = "0.1.0"
description = "TTS workbench CLI + agent Skill (mimo / edge / qwen / doubao backends)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Adam Zhuang" }]
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "python-dotenv>=1.0",
    "edge-tts>=7.0",
]

[project.optional-dependencies]
# M2: local Qwen3-TTS backend and forced aligner (Mac mini only)
qwen = []
align = []

[project.scripts]
adam_tts = "adam_tts.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/adam_tts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["smoke: real backend calls; gated on env vars (ADAM_TTS_SMOKE=1)"]
addopts = "-m 'not smoke'"
